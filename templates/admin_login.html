<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Pure | Admin Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#effcff,#dff8fc);font-family:Arial,Helvetica,sans-serif}.card{width:min(410px,92%);background:#fff;border:1px solid #d8edf3;border-radius:22px;padding:38px;box-shadow:0 20px 55px rgba(5,72,105,.14)}.brand{text-align:center;font-size:27px;font-weight:800;color:#063970}.brand span{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,#0b79a4,#2bd0d5);color:#fff;margin-right:8px}h2{text-align:center;color:#17324d;margin:25px 0 8px}p{text-align:center;color:#60758a;margin-bottom:25px}label{display:block;color:#063970;font-weight:700;font-size:14px;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #cfe7ed;border-radius:9px;font-size:15px;outline:none}input:focus{border-color:#19b5d8;box-shadow:0 0 0 3px rgba(25,181,216,.1)}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:9px;background:#063970;color:#fff;font-weight:800;font-size:15px;cursor:pointer}button:hover{background:#087ea4}.back{text-align:center;margin-top:20px}.back a{color:#087ea4;text-decoration:none;font-weight:700;font-size:14px}</style></head><body><div class="card"><div class="brand"><span>☀</span>Solar Pure</div><h2>Admin Dashboard</h2><p>Sign in to manage installation requests.</p><form method="post" action="/admin/login"><label>Username</label><input name="username" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><button type="submit">Sign In</button></form><div class="back"><a href="/">← Back to website</a></div></div></body></html>
